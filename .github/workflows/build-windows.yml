# Windows 版がビルドできるかを確かめる。
#
# 手元（macOS）でもクロスビルドはできるが、Windows 上で組んだ方が
# 実際に配る形に近い。動作確認はできないので、あくまで
# 「壊れていないか」を見るためのもの。
name: Windows ビルド

on:
  push:
    branches: [main, "codex/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    # wip ブランチ宛ての PR でも走らせる。v0.4 の PR #1 が base = codex/v0.4-wip で
    # どのトリガにも当たらず、マージ前に手動実行が要った反省から。
    branches: [main, "codex/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  # 手で動かしたい時のため
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # vendor/ は gitignore されているので、CI では毎回取得する。
      # これが無いとキャラクターの出ない配布物ができてしまう。
      - name: Live2D Cubism Core を取得する
        run: npm run fetch-core

      # 音声認識も gitignore されている。**これが無いとマイクが使えない
      # 配布物ができる。** 実際 v0.4.0 の Windows 版を組んだ時、release:win の
      # 警告で初めて気づいた（キャラクターと違って、無くても起動はしてしまう
      # ので、動かして確かめるまで分からない）。
      # モデルは141MBあるので、毎回落とさずキャッシュする。
      - name: 音声認識のモデルを取り出す
        id: whisper-model
        uses: actions/cache@v4
        with:
          path: models/ggml-base.bin
          key: whisper-ggml-base-v1

      - name: 音声認識のモデルを取得する
        if: steps.whisper-model.outputs.cache-hit != 'true'
        run: npm run fetch-whisper-model

      - name: 音声認識の実行ファイルを取得する
        run: npm run fetch-whisper-binaries

      - name: テストを通す
        run: npm run check

      - name: Windows 版を組む
        run: npm run package:win

      - name: 中身を確かめる
        shell: pwsh
        run: |
          $app = "dist/bikutan-win32-x64/resources/app"
          # macOS 専用のものが混ざっていないか
          foreach ($f in @("native/now-playing", "native/speech-recognizer.app", "native/stt/darwin-arm64")) {
            if (Test-Path "$app/$f") { throw "macOS 専用のファイルが含まれています: $f" }
          }
          # 動かすのに要るものが揃っているか。
          # **配布物はこの CI で組む。** 「手元のモデルが後から入る」という
          # 前提で models/ を見逃していたが、そんな機会は無く、v0.4.0 の
          # Windows 版はマイクの使えないものになっていた。ここで止める。
          foreach ($f in @(
            "main.js", "renderer.js", "assets/bikunavi_desktop",
            "conversation-providers.js", "vendor/live2dcubismcore.min.js",
            "models/ggml-base.bin", "native/stt/win32-x64/whisper-cli.exe"
          )) {
            if (-not (Test-Path "$app/$f")) { throw "必要なファイルがありません: $f" }
          }
          if (-not (Test-Path "dist/bikutan-win32-x64/bikutan.exe")) { throw "exe が作られていません" }

          Write-Host "確認できました"

      # 実機で試せるよう、成果物を残す。Release とは別で、
      # 動作確認のためだけに使う。
      #
      # **1回150MBあるので、毎回残すと無料枠(500MB)をすぐ使い切る。**
      # 実際 30件4.5GBまで溜まり、アップロードが失敗してビルドが赤くなった
      # (2026-08-10)。ビルドが通るかを見たいだけの push では残さず、
      # 手で起動した時（＝実機で試したい時）だけ残す。
      - name: 成果物を残す
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bikutan-win32-x64
          path: dist/bikutan-win32-x64
          retention-days: 5
